<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Dialer Control</title>
  <style>
    body {
      margin: 0;
      padding: 12px;
      background: #1c1e21;
      color: #e8e6e1;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      user-select: none;
    }
    .row { display: flex; gap: 8px; }
    button {
      flex: 1;
      padding: 14px 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
      text-align: center;
      line-height: 1.2;
    }
    button:active { transform: scale(0.97); }
    .label { font-weight: 600; font-size: 14px; }
    .sub { opacity: 0.75; font-size: 10px; margin-top: 3px; }
    #kill { background: #c0392b; }
    #call { background: #1e7e46; }
    #status { min-height: 16px; margin-top: 8px; color: #e8e6e1; }
    #status.ok { color: #a8e6b8; }
    #status.warn { color: #ffd88a; }
    #status.err { color: #ffb4a8; }

    /* Contact alert — colour set inline from the shared palette. */
    #alert { display: none; margin-top: 8px; padding: 8px 9px; border-radius: 8px; border: 1px solid; }
    #alert.show { display: block; }
    #alert .who { font-weight: 600; margin-bottom: 5px; }
    #alert .tags { display: flex; flex-wrap: wrap; gap: 5px; }
    #alert .tag {
      padding: 2px 8px; border-radius: 999px; border: 1px solid;
      font-size: 11px; font-weight: 600; white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="row">
    <button id="kill">
      <div class="label">✕ No Answer</div>
      <div class="sub">Ctrl+Shift+9</div>
    </button>
    <button id="call">
      <div class="label">▶ Call</div>
      <div class="sub">Ctrl+Shift+0</div>
    </button>
  </div>
  <div id="status">Ready — shortcuts work from anywhere</div>
  <div id="alert"></div>
  <script src="defaults.js"></script>
  <script src="panel.js"></script>
</body>
</html>
