<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Dialer Control</title>
  <style>
    :root {
      /* Three elevations and nothing else, shared with the on-page plate and
         the settings popup: the window is the ground, a raised face sits on it,
         an inset well is cut into it. Nothing in this UI is flat. */
      --bg: #141618;
      --raised: rgba(255, 255, 255, .045);
      --raised-border: rgba(255, 255, 255, .07);
      --raised-top: inset 0 1px 0 rgba(255, 255, 255, .06);
      --inset: #0f1113;
      --inset-border: rgba(255, 255, 255, .05);
      --inset-shadow: inset 0 2px 6px rgba(0, 0, 0, .6);
      --hair: rgba(255, 255, 255, .06);

      --text: #e8e6e1;
      --soft: #c9c6c0;
      --muted: #9aa0a6;
      --dim: #6b6f76;
      --ok: #a8e6b8;
      --warn: #ffd88a;
      --err: #ffb4a8;
      --live: #ff5c4d;
      --amber-bg: rgba(184, 134, 11, .18);
      --amber-border: rgba(184, 134, 11, .6);

      --btn-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .28),
        inset 0 -1px 0 rgba(0, 0, 0, .34),
        0 2px 5px rgba(0, 0, 0, .42);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100vh;
      overflow: hidden;
    }

    /* -- the two actions -------------------------------------------------- */
    /* Glyph at the top, name and key at the foot, pushed apart. The name lands
       on the same baseline on both buttons whatever the glyph is doing, and
       left-aligning gives the pair a shared edge to read down. */
    .row { display: flex; gap: 8px; flex-shrink: 0; }
    .row button {
      flex: 1 1 0;
      min-width: 0;
      height: 86px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      padding: 11px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      color: #fff;
      text-align: start;
      font-family: inherit;
      user-select: none;
    }
    /* No transform transition: the press is a spring writing an inline
       transform (spring.js), and a transition on the same property would ease
       toward each spring frame and fight it. */
    .glyph { font-size: 15px; line-height: 1; opacity: .9; }
    .foot { display: flex; flex-direction: column; gap: 7px; align-items: flex-start; max-width: 100%; min-width: 0; }
    .label { font-size: 15px; font-weight: 600; letter-spacing: -.012em; line-height: 1.1; }
    /* One chip carrying whatever keys are actually bound; panel.js fills it. */
    .sub {
      background: rgba(0, 0, 0, .24);
      border: 1px solid rgba(255, 255, 255, .16);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .04em;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #kill {
      background: linear-gradient(180deg, #d9503f 0%, #a02c1d 100%);
      box-shadow: var(--btn-shadow), 0 10px 20px rgba(190, 50, 40, .16);
    }
    #call {
      background: linear-gradient(180deg, #2aa55c 0%, #13623a 100%);
      box-shadow: var(--btn-shadow), 0 10px 20px rgba(30, 140, 80, .16);
    }

    /* -- status ----------------------------------------------------------- */
    .status-row {
      display: flex;
      align-items: center;
      gap: 7px;
      height: 18px;
      flex-shrink: 0;
      padding-inline-start: 2px;
    }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--dim); flex: 0 0 auto; }
    #status {
      flex: 1 1 auto;
      min-width: 0;
      letter-spacing: -.005em;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #status.ok { color: var(--ok); }
    #status.warn { color: var(--warn); }
    #status.err { color: var(--err); }

    /* -- contact alert ---------------------------------------------------- */
    /* A raised face carrying the tags Salesloft already put on the contact.
       Colour is set inline from the shared palette; only the shape is here. */
    #alert {
      display: none;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid;
      box-shadow: var(--raised-top);
      flex-shrink: 0;
    }
    #alert.show { display: block; }
    #alert .tags { display: flex; flex-wrap: wrap; gap: 5px; }
    #alert .tag {
      padding: 2px 8px; border-radius: 999px; border: 1px solid;
      font-size: 11px; font-weight: 600; white-space: nowrap;
    }

    /* -- transcription ---------------------------------------------------- */
    /* The one inset surface: the transcript is a well cut into the window,
       not another face sitting on it. */
    #transcription {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      position: relative;
      background: var(--inset);
      border: 1px solid var(--inset-border);
      border-radius: 12px;
      box-shadow: var(--inset-shadow);
      overflow: hidden;
    }
    #transcription.on { display: flex; }

    .transcript-bar {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 10px;
      background: rgba(255, 255, 255, .035);
      border-bottom: 1px solid var(--inset-border);
      flex-shrink: 0;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
    .dot.live { background: var(--live); animation: pulse 1.6s ease-in-out infinite; }
    .dot.offline { background: var(--dim); }
    .dot.degraded { background: #e0a020; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

    #connection { font-weight: 600; letter-spacing: .08em; font-size: 10px; }
    /* Pushes itself and the buttons to the far end, so the reading half and the
       acting half of the bar sit at opposite edges. */
    #timer {
      margin-inline-start: auto;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
      font-size: 12px;
    }

    .icon-btn {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, .05);
      border: 1px solid rgba(255, 255, 255, .1);
      color: var(--soft);
      border-radius: 6px;
      padding: 0;
      font-size: 10px;
      line-height: 1;
      cursor: pointer;
      font-family: inherit;
      flex: 0 0 auto;
      transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease;
    }
    .icon-btn:hover { background: rgba(255, 255, 255, .12); color: #fff; }
    .icon-btn[aria-pressed="true"] { background: rgba(255, 255, 255, .14); color: #fff; }
    /* Saving is the one control here that writes a file, so it carries the
       amber the rest of the extension uses for "this produces something". */
    #save { background: var(--amber-bg); border-color: var(--amber-border); color: var(--warn); }
    #save:hover { background: rgba(184, 134, 11, .3); color: var(--warn); }
    /* Set when a call ends with lines nothing has saved. */
    .icon-btn.nudge { border-color: #b8860b; color: var(--warn); }

    #transcript {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 9px 11px;
      /* Read peripherally during a live conversation, so this stays large
         and high contrast even though the rest of the panel is compact. */
      font-size: 14px;
      line-height: 1.5;
      user-select: text;
      text-wrap: pretty;
      /* The top line fades under the bar instead of being guillotined by it,
         which is what says the list continues upward. */
      -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 10px, #000 100%);
      mask-image: linear-gradient(180deg, transparent 0, #000 10px, #000 100%);
    }
    #transcript::-webkit-scrollbar { width: 8px; }
    #transcript::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .14); border-radius: 4px; }
    #transcript::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, .24); }
    #transcript::-webkit-scrollbar-track { background: transparent; }

    /* A line rises in rather than blinking on: a transcript arrives while the
       rep is listening, not looking, so movement is what says one landed. */
    .entry { margin-bottom: 7px; animation: line-in .3s cubic-bezier(.23, 1, .32, 1) both; }
    @keyframes line-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .entry-time { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; margin-inline-end: 6px; }
    .entry-text { color: var(--text); text-wrap: pretty; }
    .entry.merged .entry-time::after { content: " ~"; color: #e0a020; }
    #empty { color: var(--dim); font-size: 12px; font-style: italic; }
    .caret { display: inline-block; width: 7px; height: 15px; background: var(--muted); animation: pulse 1.1s infinite; vertical-align: text-bottom; }

    #scroll-hint {
      display: none;
      position: absolute;
      inset-inline-end: 12px;
      bottom: 10px;
      background: rgba(255, 255, 255, .14);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 2px 6px rgba(0, 0, 0, .4);
    }
    #scroll-hint.on { display: block; }

    /* The springs already snap (spring.js checks the query on every call), so
       all that is left to stop is the two looping animations. */
    @media (prefers-reduced-motion: reduce) {
      .dot.live, .caret { animation: none; }
      .entry { animation: none; }
    }
  </style>
</head>
<body>
  <!-- The contact tag sits at the top, the same place the on-page plate puts
       it, so the two surfaces read as one product. -->
  <div id="alert"></div>

  <!-- The key chips are filled in from the keys that are actually bound: the
       rep's own binding, and whatever Chrome has for the same command. -->
  <div class="row">
    <button id="kill" data-action="kill-and-log">
      <span class="glyph">✕</span>
      <span class="foot">
        <span class="label">No Answer</span>
        <span class="sub"></span>
      </span>
    </button>
    <button id="call" data-action="start-call">
      <span class="glyph">▶</span>
      <span class="foot">
        <span class="label">Call</span>
        <span class="sub"></span>
      </span>
    </button>
  </div>

  <div class="status-row">
    <span class="status-dot"></span>
    <div id="status">Ready</div>
  </div>

  <section id="transcription">
    <div class="transcript-bar">
      <span class="dot offline" id="indicator"></span>
      <span id="connection">OFFLINE</span>
      <span id="timer">00:00</span>
      <button class="icon-btn" id="pause" title="Pause transcription" aria-pressed="false">⏸</button>
      <button class="icon-btn" id="copy" title="Copy transcript">⧉</button>
      <button class="icon-btn" id="save" title="Save transcript as text">↓</button>
      <button class="icon-btn" id="clear" title="Clear transcript">✕</button>
    </div>
    <div id="transcript" tabindex="-1">
      <div id="empty">Waiting for the call to start…</div>
    </div>
    <button id="scroll-hint">↓ New text</button>
  </section>

  <script src="defaults.js"></script>
  <script src="spring.js"></script>
  <script src="panel.js"></script>
</body>
</html>
