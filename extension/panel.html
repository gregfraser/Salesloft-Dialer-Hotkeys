<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Dialer Control</title>
  <style>
    :root {
      --bg: #1c1e21;
      --surface: #26282c;
      --border: #3a3d42;
      --text: #e8e6e1;
      --muted: #9aa0a6;
      --ok: #a8e6b8;
      --err: #ffb4a8;
      --live: #ff5c4d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, sans-serif;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .row { display: flex; gap: 8px; flex-shrink: 0; }
    .row button {
      flex: 1;
      padding: 14px 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
      text-align: center;
      line-height: 1.2;
      font-family: inherit;
    }
    .row button { user-select: none; }
    .row button:active { transform: scale(0.97); }
    .label { font-weight: 600; font-size: 14px; }
    .sub { opacity: 0.75; font-size: 11px; margin-top: 3px; }
    #kill { background: #c0392b; }
    #call { background: #1e7e46; }

    #status { min-height: 16px; margin-top: 8px; color: var(--text); flex-shrink: 0; }
    #status.ok { color: var(--ok); }
    #status.warn { color: #ffd88a; }
    #status.err { color: var(--err); }

    /* Contact alert — colour set inline from the shared palette. */
    #alert { display: none; margin-top: 8px; padding: 8px 9px; border-radius: 8px; border: 1px solid; flex-shrink: 0; }
    #alert.show { display: block; }
    #alert .tags { display: flex; flex-wrap: wrap; gap: 5px; }
    #alert .tag {
      padding: 2px 8px; border-radius: 999px; border: 1px solid;
      font-size: 11px; font-weight: 600; white-space: nowrap;
    }

    /* -- transcription -- */
    #transcription { display: none; flex-direction: column; flex: 1; min-height: 0; margin-top: 10px; }
    #transcription.on { display: flex; }

    .transcript-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px 8px 0 0;
      border-bottom: none;
      flex-shrink: 0;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0;
    }
    .dot.live { background: var(--live); animation: pulse 1.6s ease-in-out infinite; }
    .dot.offline { background: #6b6f76; }
    .dot.degraded { background: #e0a020; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    #connection { font-weight: 600; letter-spacing: .04em; font-size: 11px; }
    #timer { margin-inline-start: auto; font-variant-numeric: tabular-nums; color: var(--muted); }

    .icon-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 3px 7px;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
    }
    .icon-btn:hover { border-color: #5a5e66; }
    .icon-btn[aria-pressed="true"] { background: #3a3d42; }
    /* Set when a call ends with lines nothing has saved. */
    .icon-btn.nudge { border-color: #b8860b; color: #ffd88a; }

    #transcript {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 10px;
      background: #141618;
      border: 1px solid var(--border);
      border-radius: 0 0 8px 8px;
      /* Read peripherally during a live conversation, so this stays large
         and high contrast even though the rest of the panel is compact. */
      font-size: 14px;
      line-height: 1.45;
      user-select: text;
    }
    .entry { margin-bottom: 10px; }
    .entry-time { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .entry-text { color: var(--text); text-wrap: pretty; }
    .entry.merged .entry-time::after { content: " ~"; color: #e0a020; }
    #empty { color: var(--muted); font-size: 12px; font-style: italic; }
    .caret { display: inline-block; width: 7px; height: 15px; background: var(--muted); animation: pulse 1.1s infinite; vertical-align: text-bottom; }

    #scroll-hint {
      display: none;
      position: absolute;
      inset-inline-end: 20px;
      bottom: 18px;
      background: var(--border);
      color: var(--text);
      border: none;
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
    }
    #scroll-hint.on { display: block; }
  </style>
</head>
<body>
  <div class="row">
    <button id="kill">
      <div class="label">✕ No Answer</div>
      <div class="sub">Ctrl+Shift+9</div>
    </button>
    <button id="call">
      <div class="label">▶ Call</div>
      <div class="sub">Ctrl+Shift+0</div>
    </button>
  </div>
  <div id="status">Ready — shortcuts work from anywhere</div>
  <div id="alert"></div>

  <section id="transcription">
    <div class="transcript-bar">
      <span class="dot offline" id="indicator"></span>
      <span id="connection">OFFLINE</span>
      <span id="timer">00:00</span>
      <button class="icon-btn" id="pause" title="Pause transcription" aria-pressed="false">⏸</button>
      <button class="icon-btn" id="copy" title="Copy transcript">⧉</button>
      <button class="icon-btn" id="save" title="Save transcript as text">↓</button>
      <button class="icon-btn" id="clear" title="Clear transcript">✕</button>
    </div>
    <div id="transcript" tabindex="-1">
      <div id="empty">Waiting for the call to start…</div>
    </div>
    <button id="scroll-hint">↓ New text</button>
  </section>

  <script src="defaults.js"></script>
  <script src="panel.js"></script>
</body>
</html>
